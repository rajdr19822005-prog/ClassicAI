name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --org=com.classicai .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.classicai.classicai"', 'applicationId = "com.classicai.mobile"')
          p.write_text(s)
          import re
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ms = manifest.read_text()
          if 'android.permission.INTERNET' not in ms:
              ms = ms.replace('    <application', '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          ms = re.sub(r'android:label="[^"]+"', 'android:label="ClassicalAI"', ms, count=1)
          manifest.write_text(ms)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Validate app JavaScript and security invariants
        run: |
          node --check assets/web/app.js
          ! grep -Eq 'SUPABASE_ANON_KEY|supabaseClient\.from|rzp_live_|jyotidr\.19822005-1@oksbi|919235551713|localStorage\.(getItem|setItem)\("khc_saved_cases"' assets/web/app.js
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload debug APK (not for Play upload)
        uses: actions/upload-artifact@v4
        with:
          name: classicai-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  signed-play-bundle:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Check release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 repository secret'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS repository secret'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD repository secret'; exit 1; }
          test -n "$ANDROID_STORE_PASSWORD" || { echo 'Missing ANDROID_STORE_PASSWORD repository secret'; exit 1; }
      - name: Generate Android platform files and configure signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          flutter create --platforms=android --org=com.classicai .
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('applicationId = "com.classicai.classicai"', 'applicationId = "com.classicai.mobile"')
          if 'import java.util.Properties' not in s:
              s = 'import java.io.FileInputStream\nimport java.util.Properties\n\n' + s
          match = re.search(r'plugins\s*\{.*?\n\}', s, re.S)
          if not match:
              raise SystemExit('Could not locate Gradle plugins block.')
          if 'val keystoreProperties = Properties()' not in s:
              setup = '\n\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n'
              s = s[:match.end()] + setup + s[match.end():]
          if 'create("release")' not in s:
              s = s.replace('    buildTypes {', '    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties["keyAlias"] as String\n            keyPassword = keystoreProperties["keyPassword"] as String\n            storeFile = file(keystoreProperties["storeFile"] as String)\n            storePassword = keystoreProperties["storePassword"] as String\n        }\n    }\n\n    buildTypes {')
          s = s.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ms = manifest.read_text()
          if 'android.permission.INTERNET' not in ms:
              ms = ms.replace('    <application', '    <uses-permission android:name="android.permission.INTERNET" />\n    <application', 1)
          ms = re.sub(r'android:label="[^"]+"', 'android:label="ClassicalAI"', ms, count=1)
          manifest.write_text(ms)
          PY
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Build signed Android App Bundle
        run: flutter build appbundle --release
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: classicai-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
